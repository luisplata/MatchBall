<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>MatchBallance</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101014;
      }
      #unity-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #101014;
        outline: none;
        touch-action: none;
      }
      #unity-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #e6e6ea;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        background: #101014;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1" style="background: {{{ BACKGROUND_COLOR }}}"></canvas>
    <div id="unity-loading">Cargando…</div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      (function () {
        var canvas = document.querySelector("#unity-canvas");
        var loading = document.querySelector("#unity-loading");

        var config = {
          arguments: [],
          dataUrl: "Build/{{{ DATA_FILENAME }}}",
          frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
          workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
          codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
          symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
          streamingAssetsUrl: "StreamingAssets",
          companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
          productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
          productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
        };

        createUnityInstance(canvas, config, function (progress) {
          loading.textContent = "Cargando " + Math.round(progress * 100) + "%";
        }).then(function (unityInstance) {
          loading.style.display = "none";
          canvas.focus();
          window.unityInstance = unityInstance;
        }).catch(function (message) {
          loading.style.display = "none";
          alert(message);
        });
      })();
    </script>
  </body>
</html>
